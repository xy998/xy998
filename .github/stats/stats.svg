<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xy998's GitHub Stats</title>
  <desc id="desc">GitHub profile statistics generated by GitHub Actions.</desc>
  <style>
    :root {
      --title: #24292f;
      --text: #57606a;
      --value: #24292f;
      --muted: #6e7781;
      --accent: #2f81f7;
      --gradient-a: #0969da;
      --gradient-b: #8250df;
      --gradient-c: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --title: #f0f6fc;
        --text: #c9d1d9;
        --value: #f0f6fc;
        --muted: #8b949e;
        --accent: #58a6ff;
        --gradient-a: #58a6ff;
        --gradient-b: #a371f7;
        --gradient-c: #f778ba;
      }
    }
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--title); }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
    .value { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--value); }
    .meta { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
    .gradient-a { stop-color: var(--gradient-a); }
    .gradient-b { stop-color: var(--gradient-b); }
    .gradient-c { stop-color: var(--gradient-c); }
    .gradient-text { fill: url(#textGradient); }
    .dot { fill: url(#textGradient); }
    .card-border { fill: none; stroke: url(#borderGradient); stroke-width: 1.5; opacity: 0.96; }
  </style>
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="1">
      <stop class="gradient-a" offset="0%"/>
      <stop class="gradient-b" offset="52%"/>
      <stop class="gradient-c" offset="100%"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop class="gradient-a" offset="0%"/>
      <stop class="gradient-b" offset="48%"/>
      <stop class="gradient-c" offset="100%"/>
    </linearGradient>
  </defs>
  <rect width="495" height="195" rx="10" fill="transparent"/>
  <rect class="card-border" x="1" y="1" width="493" height="193" rx="10"/>
  <text class="title gradient-text" x="24" y="34">xy998's GitHub Stats</text>
  <text class="meta gradient-text" x="24" y="52">Public activity snapshot</text>
  <circle class="dot" cx="28" cy="65" r="4"/><text class="label gradient-text" x="42" y="70">Public Repos</text><text class="value gradient-text" x="173" y="70">6</text><circle class="dot" cx="260" cy="65" r="4"/><text class="label gradient-text" x="274" y="70">Total Stars</text><text class="value gradient-text" x="405" y="70">0</text><circle class="dot" cx="28" cy="107" r="4"/><text class="label gradient-text" x="42" y="112">Followers</text><text class="value gradient-text" x="173" y="112">0</text><circle class="dot" cx="260" cy="107" r="4"/><text class="label gradient-text" x="274" y="112">Total Forks</text><text class="value gradient-text" x="405" y="112">0</text><circle class="dot" cx="28" cy="149" r="4"/><text class="label gradient-text" x="42" y="154">Following</text><text class="value gradient-text" x="173" y="154">0</text><circle class="dot" cx="260" cy="149" r="4"/><text class="label gradient-text" x="274" y="154">Languages</text><text class="value gradient-text" x="405" y="154">5</text>
</svg>
