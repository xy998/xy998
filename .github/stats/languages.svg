<svg width="360" height="195" viewBox="0 0 360 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xy998's Top Languages</title>
  <desc id="desc">Top programming languages generated from public repositories.</desc>
  <style>
    :root {
      --title: #24292f;
      --text: #57606a;
      --value: #24292f;
      --muted: #6e7781;
      --accent: #2f81f7;
      --gradient-a: #0969da;
      --gradient-b: #8250df;
      --gradient-c: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --title: #f0f6fc;
        --text: #c9d1d9;
        --value: #f0f6fc;
        --muted: #8b949e;
        --accent: #58a6ff;
        --gradient-a: #58a6ff;
        --gradient-b: #a371f7;
        --gradient-c: #f778ba;
      }
    }
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--title); }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
    .percent { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--value); }
    .meta { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
    .gradient-a { stop-color: var(--gradient-a); }
    .gradient-b { stop-color: var(--gradient-b); }
    .gradient-c { stop-color: var(--gradient-c); }
    .gradient-text { fill: url(#textGradient); }
    .card-border { fill: none; stroke: url(#borderGradient); stroke-width: 1.5; opacity: 0.96; }
  </style>
  <defs>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="1">
      <stop class="gradient-a" offset="0%"/>
      <stop class="gradient-b" offset="52%"/>
      <stop class="gradient-c" offset="100%"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop class="gradient-a" offset="0%"/>
      <stop class="gradient-b" offset="48%"/>
      <stop class="gradient-c" offset="100%"/>
    </linearGradient>
  </defs>
  <rect width="360" height="195" rx="10" fill="transparent"/>
  <rect class="card-border" x="1" y="1" width="358" height="193" rx="10"/>
  <text class="title gradient-text" x="24" y="34">Top Languages</text>
  <text class="meta gradient-text" x="24" y="52">Across public source repositories</text>
  <clipPath id="bar">
    <rect x="24" y="56" width="312" height="8" rx="4"/>
  </clipPath>
  <g clip-path="url(#bar)">
    <rect x="24.00" y="56" width="309.39" height="8" fill="#f1e05a"/><rect x="333.39" y="56" width="2.61" height="8" fill="#e34c26"/>
  </g>
  <circle cx="29" cy="84" r="4" fill="#f1e05a"/><text class="label gradient-text" x="40" y="88">JavaScript</text><text class="percent gradient-text" x="336" y="88" text-anchor="end">99.2%</text><circle cx="29" cy="102" r="4" fill="#e34c26"/><text class="label gradient-text" x="40" y="106">HTML</text><text class="percent gradient-text" x="336" y="106" text-anchor="end">0.8%</text>
</svg>
