name: Generate GitHub Languages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  generate-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch languages.svg
        run: |
          mkdir -p .github/stats
          curl -fL "https://github-readme-stats.vercel.app/api/top-langs?username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=333&text_color=555" -o .github/stats/languages.svg

      - name: Commit and push languages.svg
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .github/stats/languages.svg
          git commit -m "chore: auto-update languages.svg" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
