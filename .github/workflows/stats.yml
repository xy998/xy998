name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - ".github/stats/**"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate_readme_stats.py stats

      - name: Commit and push stats.svg
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .github/stats/stats.svg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: auto-update stats.svg"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 3
          done
          exit 1
