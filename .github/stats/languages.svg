<svg width="360" height="195" viewBox="0 0 360 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xy998's Top Languages</title>
  <desc id="desc">Top programming languages generated from public repositories.</desc>
  <style>
    :root { --title: #24292f; --text: #57606a; --value: #24292f; --muted: #6e7781; --accent: #2f81f7; }
    @media (prefers-color-scheme: dark) {
      :root { --title: #f0f6fc; --text: #c9d1d9; --value: #f0f6fc; --muted: #8b949e; --accent: #58a6ff; }
    }
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--title); }
    .label { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--text); }
    .percent { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--value); }
    .meta { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
  </style>
  <rect width="360" height="195" rx="6" fill="transparent"/>
  <text class="title" x="24" y="34">Top Languages</text>
  <text class="meta" x="24" y="52">Across public source repositories</text>
  <clipPath id="bar">
    <rect x="24" y="56" width="312" height="8" rx="4"/>
  </clipPath>
  <g clip-path="url(#bar)">
    <rect x="24.00" y="56" width="288.48" height="8" fill="#f1e05a"/><rect x="312.48" y="56" width="15.94" height="8" fill="#41b883"/><rect x="328.42" y="56" width="3.92" height="8" fill="#3178c6"/><rect x="332.33" y="56" width="2.43" height="8" fill="#e34c26"/><rect x="334.76" y="56" width="1.24" height="8" fill="#563d7c"/>
  </g>
  <circle cx="29" cy="84" r="4" fill="#f1e05a"/><text class="label" x="40" y="88">JavaScript</text><text class="percent" x="336" y="88" text-anchor="end">92.5%</text><circle cx="29" cy="102" r="4" fill="#41b883"/><text class="label" x="40" y="106">Vue</text><text class="percent" x="336" y="106" text-anchor="end">5.1%</text><circle cx="29" cy="120" r="4" fill="#3178c6"/><text class="label" x="40" y="124">TypeScript</text><text class="percent" x="336" y="124" text-anchor="end">1.3%</text><circle cx="29" cy="138" r="4" fill="#e34c26"/><text class="label" x="40" y="142">HTML</text><text class="percent" x="336" y="142" text-anchor="end">0.8%</text><circle cx="29" cy="156" r="4" fill="#563d7c"/><text class="label" x="40" y="160">CSS</text><text class="percent" x="336" y="160" text-anchor="end">0.4%</text>
</svg>
